services:

  nginx:
    image: nginx:latest
    container_name: movies_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx_configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_configs/sites:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_started

  api:
    build:
      dockerfile: src/Dockerfile
      context: .
    image: movies-auth-image
    container_name: movies_auth
    env_file:
      - ./.env
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: movies_db_auth
    restart: always
    volumes:
      - movies_auth_data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}" ]
      interval: 5s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7.4.1-alpine
    container_name: movies_redis_auth
    restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 3s
      retries: 50

  test:
    build:
      dockerfile: src/Dockerfile
      context: .
    image: movies-auth-image
    container_name: movies_auth_tests
    entrypoint: "sh entrypoint-test.sh"
    env_file:
      - ./.env

volumes:
  movies_auth_data:
